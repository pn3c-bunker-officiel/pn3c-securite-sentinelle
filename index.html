<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUARDIAN CI-PN3C - Le Site Sauveur du Peuple</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  body { margin:0; font-family: 'Segoe UI', sans-serif; background:#0a0a0a; color:white; }
  .hero { text-align:center; padding:50px 20px; background: linear-gradient(135deg, #FF8C00, #FFFFFF, #00A651); color:#000; }
  .hero h1 { font-size: 3em; margin:0; font-weight:900; }
  .tracker-box { height:500px; margin:20px; border:3px solid #FF8C00; border-radius:20px; overflow:hidden; }
  #map { height:100%; width:100%; }
  .btn-rejoindre {
    display:block; width:80%; max-width:400px; margin:30px auto;
    padding:20px; font-size:1.5em; font-weight:900; text-align:center;
    text-decoration:none; color:black; border-radius:50px;
    background: linear-gradient(90deg, #FF8C00 0%, #FFFFFF 50%, #00A651 100%);
    box-shadow: 0 0 30px rgba(255,140,0,0.6);
    transition: 0.3s;
  }
  .btn-rejoindre:hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(0,166,81,0.8); }
</style>
</head>
<body>

<div class="hero">
  <h1>GUARDIAN CI-PN3C</h1>
  <p>🛡️ Le Bouclier Numérique de la Côte d'Ivoire - Par Jésus-Christ, notre Ingénieur en Chef 🛰️</p>
</div>

<div style="text-align:center; padding:20px;">
  <h2>📡 TRACKER NATIONAL EN TEMPS RÉEL</h2>
  <p>Chaque lumière est un citoyen protégé</p>
</div>

<div class="tracker-box">
  <div id="map"></div>
</div>

<a href="#inscription" class="btn-rejoindre">REJOINDRE LA GARDE NATIONALE 🇨🇮</a>

<div style="text-align:center; padding:40px; color:#aaa;">
  <p>Site Sauveur - Site Libérateur - Produit Fini - Version 22 Octobre</p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // INITIALISATION DU TRACKER
  var map = L.map('map').setView([7.54, -5.55], 7); // Centré sur la CI
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  // Exemple de lumières - à connecter à ton vrai serveur après
  L.marker([5.32, -4.01]).addTo(map).bindPopup("Abidjan - Poste Actif 🟢");
  L.marker([6.82, -5.27]).addTo(map).bindPopup("Yamoussoukro - Poste Actif 🟢");
  L.marker([9.45, -5.62]).addTo(map).bindPopup("Korhogo - En attente d'autorisation 🟡");

  // Ici tu connecteras tes vraies alertes : map va se mettre à jour en temps réel
  console.log("GUARDIAN CI-PN3C - Tracker Sacré Activé au nom de Jésus-Christ");
</script>

</body>
</html>
