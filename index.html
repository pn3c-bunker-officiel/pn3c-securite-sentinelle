<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BOUSSOLE CITOYENNE CI</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>body{background:#f5f7fb;color:#1a2b4c;font-family:sans-serif;margin:0;padding:10px}.card{border:2px solid #1a73e8;padding:12px;margin:8px 0;background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}button{border:none;padding:14px;font-weight:bold;width:100%;margin:6px 0;border-radius:10px;font-size:15px;cursor:pointer}button.red{background:#e53935;color:white;animation:clignote 1s infinite;box-shadow:0 0 15px #e53935}button.green{background:#25D366;color:white}button.blue{background:#1a73e8;color:white}button.orange{background:#ff9800;color:white}input{width:92%;padding:12px;border:2px solid #1a73e8;margin:6px 0;border-radius:8px}.tab{display:flex;gap:4px}.tab div{flex:1;text-align:center;padding:10px;border:2px solid #1a73e8;border-radius:10px;background:white;font-weight:bold;font-size:12px}.tab div.active{background:#1a73e8;color:white}#map{height:350px;border:2px solid #1a73e8;border-radius:12px}#qrcode{display:flex;justify-content:center;padding:10px;background:white;border-radius:8px;margin:10px 0}@keyframes clignote{0%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.05);box-shadow:0 0 25px red}100%{opacity:1;transform:scale(1)}}.contact-item{display:flex;align-items:center;gap:8px;background:#eef4ff;padding:10px;margin:6px 0;border-radius:8px;border-left:4px solid #1a73e8}.urgence-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.urgence-btn{padding:12px;border-radius:10px;text-align:center;font-weight:bold;color:white;text-decoration:none;display:block}</style></head><body><h1 style="text-align:center">🧭 BOUSSOLE CITOYENNE CI 🇨🇮</h1><div class="tab"><div id="tab-bunker" class="active" onclick="showTab('bunker')">🏠 ACCUEIL</div><div id="tab-map" onclick="showTab('map')">🗺️ CARTE</div><div id="tab-urg" onclick="showTab('urg')">🚨 URGENCE</div></div><div id="view-bunker"><div class="card"><h2>📍 Centre d'Entraide</h2><p>Veilleur: <b id="gardienName">Veilleur</b><br><span id="gps" style="color:#1a73e8;font-weight:bold"></span></p><div id="qrcode"></div><div id="previewMsg" style="background:#fff3cd;padding:10px;border-radius:8px;margin:10px 0;display:none;white-space:pre-wrap;font-size:13px;border:1px dashed orange"></div><button class="red" onclick="preparerSOS()">🆘 PRÉPARER ALERTE - CLIGNOTE</button><button class="green" id="btnSendWA" style="display:none" onclick="lancerSOS()">📤 ENVOYER AUX CONTACTS COCHÉS + GROUPE</button><button class="green" onclick="partagerPN3C()">📤 PARTAGER LE SITE</button></div><div class="card"><h2>👥 Voisins Solidaires - COCHE AVANT D'ENVOYER</h2><input id="cNom" placeholder="Nom ex: Tonton Yop"><input id="cTel" placeholder="Numéro 07..."><button class="blue" onclick="addContact()">✅ AJOUTER LE NUMÉRO</button><div style="margin:10px 0;display:flex;gap:6px"><button style="width:50%;background:#eef4ff;color:#1a73e8;border:1px solid #1a73e8;padding:8px" onclick="toutCocher(true)">☑️ Tout cocher</button><button style="width:50%;background:#eef4ff;color:#1a73e8;border:1px solid #1a73e8;padding:8px" onclick="toutCocher(false)">◻️ Tout décocher</button></div><div id="listeContacts" style="margin-top:12px"></div><p id="msgAdd" style="color:green;font-weight:bold;text-align:center"></p><hr><h3>📢 Groupe WhatsApp PN3C</h3><input id="groupeLink" placeholder="Colle le lien d'invitation du groupe WhatsApp ici"><button class="blue" onclick="saveGroupe()">💾 SAUVEGARDER LE LIEN DU GROUPE</button><p id="msgGroupe" style="font-size:12px;color:green"></p></div></div><div id="view-map" style="display:none"><div class="card"><h2>🛰️ CARTE</h2><div id="map"></div><button class="blue" onclick="centerMap()">📍 MOI</button></div></div><div id="view-urg" style="display:none"><div class="card" style="border-color:#e53935"><h2>🚨 NUMÉROS D'URGENCE CI</h2><div class="urgence-grid"><a href="tel:111" class="urgence-btn" style="background:#1a2b4c">👮 POLICE SECOURS<br><b>111</b></a><a href="tel:170" class="urgence-btn" style="background:#2c3e50">👮 POLICE<br><b>170</b></a><a href="tel:180" class="urgence-btn" style="background:#e53935">🔥 POMPIERS<br><b>180</b></a><a href="tel:185" class="urgence-btn" style="background:#e53935">🚑 SAMU<br><b>185</b></a><a href="tel:145" class="urgence-btn" style="background:#34495e">🪖 GENDARMERIE<br><b>145</b></a><a href="tel:130" class="urgence-btn" style="background:#ff9800">⚠️ ONPC<br><b>130</b></a></div><button class="orange" onclick="appelerUrgenceGenerale()" style="margin-top:12px">📞 ALERTER VOISINS COCHÉS + GROUPE QUE J'APPELLE LES SECOURS</button></div></div><script>const SITE_URL=window.location.href;let contacts=JSON.parse(localStorage.getItem('contactsPN3C')||'[]');let groupeLink=localStorage.getItem('groupePN3C')||'';let lat=5.359,lon=-4.008,map,myMarker,msgSOS='';let gardien=localStorage.getItem('gardienPN3C')||'Veilleur Abidjan';document.getElementById('gardienName').innerText=gardien;if(groupeLink)document.getElementById('groupeLink').value=groupeLink;function showTab(t){document.getElementById('view-bunker').style.display=t=='bunker'?'block':'none';document.getElementById('view-map').style.display=t=='map'?'block':'none';document.getElementById('view-urg').style.display=t=='urg'?'block':'none';document.getElementById('tab-bunker').className=t=='bunker'?'active':'';document.getElementById('tab-map').className=t=='map'?'active':'';document.getElementById('tab-urg').className=t=='urg'?'active':'';if(t=='map')setTimeout(initMap,200)}navigator.geolocation.watchPosition(p=>{lat=p.coords.latitude;lon=p.coords.longitude;document.getElementById('gps').innerText=`📍 ${lat.toFixed(5)}, ${lon.toFixed(5)}`;try{document.getElementById('qrcode').innerHTML='';new QRCode(document.getElementById('qrcode'),{text:SITE_URL,width:120,height:120})}catch(e){}if(myMarker)myMarker.setLatLng([lat,lon])},null,{enableHighAccuracy:true});function initMap(){if(map)return;map=L.map('map').setView([lat,lon],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);myMarker=L.marker([lat,lon]).addTo(map).bindPopup("VOUS").openPopup()}function centerMap(){if(map)map.setView([lat,lon],15)}function addContact(){let n=document.getElementById('cNom').value.trim();let t=document.getElementById('cTel').value.trim();if(!n||!t){alert('Mets Nom et Numéro');return}let clean=t.replace(/\D/g,'');if(clean.length<8){alert('Numéro court');return}if(clean.startsWith('0'))clean='225'+clean.substring(1);if(!clean.startsWith('225'))clean='225'+clean;contacts.push({nom:n,tel:clean,checked:true});localStorage.setItem('contactsPN3C',JSON.stringify(contacts));document.getElementById('cNom').value='';document.getElementById('cTel').value='';document.getElementById('msgAdd').innerText='✅ '+n+' ajouté et coché!';renderContacts();setTimeout(()=>document.getElementById('msgAdd').innerText='',2000)}function renderContacts(){let h='';contacts.forEach((c,i)=>{h+=`<div class="contact-item"><input type="checkbox" id="chk${i}" ${c.checked?'checked':''} onchange="toggleCheck(${i})" style="width:20px;height:20px"><label for="chk${i}" style="flex:1"><b>${c.nom}</b><br><small>${c.tel}</small></label><span onclick="supprimerContact(${i})" style="color:red;font-weight:bold;cursor:pointer;background:white;padding:4px 8px;border-radius:4px">[X]</span></div>`});document.getElementById('listeContacts').innerHTML=h||'<p style="font-size:12px;color:#999;text-align:center">Aucun voisin - ajoute d\'abord</p>'}function toggleCheck(i){contacts[i].checked=document.getElementById('chk'+i).checked;localStorage.setItem('contactsPN3C',JSON.stringify(contacts))}function toutCocher(v){contacts.forEach(c=>c.checked=v);localStorage.setItem('contactsPN3C',JSON.stringify(contacts));renderContacts()}function supprimerContact(i){if(confirm('Supprimer?')){contacts.splice(i,1);localStorage.setItem('contactsPN3C',JSON.stringify(contacts));renderContacts()}}function saveGroupe(){let l=document.getElementById('groupeLink').value.trim();if(!l.includes('chat.whatsapp.com')){alert('Colle le vrai lien du groupe WhatsApp (https://chat.whatsapp.com/...)');return}localStorage.setItem('groupePN3C',l);groupeLink=l;document.getElementById('msgGroupe').innerText='✅ Lien groupe sauvegardé!';setTimeout(()=>document.getElementById('msgGroupe').innerText='',2000)}renderContacts();function preparerSOS(){let sel=contacts.filter(c=>c.checked);if(sel.length==0){alert('Coche au moins 1 voisin avec la case ☑️ !');return}msgSOS=`🆘 BOUSSOLE CITOYENNE CI 🇨🇮\n${gardien} demande entraide URGENTE\n📍 ${lat.toFixed(5)},${lon.toFixed(5)}\nhttps://www.google.com/maps?q=${lat},${lon}\nSite: ${SITE_URL}\n\nEnvoyé à ${sel.length} voisin(s) + Groupe PN3C`;document.getElementById('previewMsg').style.display='block';document.getElementById('previewMsg').innerText=msgSOS+"\n\n✅ Prêt à envoyer aux "+sel.length+" cochés + groupe";document.getElementById('btnSendWA').style.display='block';document.getElementById('btnSendWA').innerText=`📤 ENVOYER À ${sel.length} COCHÉS ${groupeLink?'+ GROUPE':''}`;document.getElementById('previewMsg').scrollIntoView({behavior:'smooth'})}function lancerSOS(){let sel=contacts.filter(c=>c.checked);if(sel.length==0){alert('Coche au moins 1 contact!');return}let enc=encodeURIComponent(msgSOS);sel.forEach((c,i)=>{setTimeout(()=>{window.open(`https://wa.me/${c.tel}?text=${enc}`,'_blank')},i*1500)});if(groupeLink){setTimeout(()=>{window.open(groupeLink,'_blank');setTimeout(()=>{window.open(`https://wa.me/?text=${enc}`,'_blank')},800)},sel.length*1500+500)}else if(sel.length>0){setTimeout(()=>{if(confirm('Veux-tu aussi partager dans un groupe WhatsApp? Colle le lien du groupe dans le champ plus haut.')){window.open(`https://wa.me/?text=${enc}`,'_blank')}},sel.length*1500+500)}}function partagerPN3C(){let m=`🧭 BOUSSOLE CITOYENNE CI 🇨🇮\nInitiative d'entraide\n👉 ${SITE_URL}`;window.open(`https://wa.me/?text=${encodeURIComponent(m)}`,'_blank')}function appelerUrgenceGenerale(){let sel=contacts.filter(c=>c.checked);if(sel.length==0&&!groupeLink){alert('Coche des voisins d\'abord ou sauvegarde ton groupe!');return}let msg=`🚨 J'APPELLE LES SECOURS (111/180) 🇨🇮\n${gardien}\n📍 ${lat.toFixed(5)},${lon.toFixed(5)}\nhttps://www.google.com/maps?q=${lat},${lon}\nVenez m'aider!`;let enc=encodeURIComponent(msg);sel.forEach((c,i)=>{setTimeout(()=>{window.open(`https://wa.me/${c.tel}?text=${enc}`,'_blank')},i*1200)});if(groupeLink){setTimeout(()=>{window.open(`https://wa.me/?text=${enc}`,'_blank')},sel.length*1200+500)}alert('Maintenant appelle 111 ou 180! Tes voisins cochés + groupe sont alertés!')}</script></body></html>
